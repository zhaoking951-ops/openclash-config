; ZhaoKing_Home_V3_1.ini
; 基线：Loyalsoldier/clash-rules 白名单模式 + Mihomo GeoSite
; 核心原则：
;   1) 已知域名/IP由成熟规则库直接判定
;   2) 游戏单独拆分“下载/更新”和“登录/联机/社区”
;   3) 游戏下载：国内节点 DIRECT，国外节点 PROXY
;   4) 游戏游玩/登录：明确国内服务 DIRECT，其余 PROXY
;   5) 真正未知：解析真实 IP，中国 DIRECT，其余 PROXY
;   6) 最终仅两个出口：DIRECT / 🚀 手动选择
; 假定订阅转换后端支持 Mihomo AND 逻辑规则
; 2026-10-07

[custom]

; ============================================================
; A. 已知域名：明确 DIRECT
; ============================================================

; 私有网络域名
ruleset=DIRECT,clash-domain:https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt,86400

; Loyalsoldier 白名单模式中的 Apple / iCloud 直连库
ruleset=DIRECT,clash-domain:https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt,86400
ruleset=DIRECT,clash-domain:https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt,86400

; ============================================================
; B. 游戏特殊层
; ============================================================

; B1. 明确标记为中国接入点的游戏服务：DIRECT
;     包含 Steam / EA / Blizzard / Epic / Nintendo 等上游 @cn 条目
ruleset=DIRECT,[]GEOSITE,category-games@cn

; B2. 明确标记为中国区的游戏下载/更新节点：DIRECT
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download@cn

; B3. 游戏下载域名虽然未标 @cn，但实际解析到中国 IP：DIRECT
;     Mihomo 会在此对“游戏下载域名”解析真实目标 IP。
ruleset=DIRECT,[]AND,((GEOSITE,category-game-platforms-download),(GEOIP,CN))

; B4. 剩余游戏下载/更新节点均为非中国路径：PROXY
;     例如 Steam 新加坡 Valve CDN / 海外 PS 下载 / Ubisoft 海外下载等
ruleset=🚀 手动选择,[]GEOSITE,category-game-platforms-download

; B5. 剩余游戏平台/登录/社区/联机服务：PROXY
;     国内已知服务已被 B1 提前摘走。
ruleset=🚀 手动选择,[]GEOSITE,category-games

; ============================================================
; C. Loyalsoldier 已知域名大库
; ============================================================

; Google：沿用 Loyalsoldier 推荐白名单模式，优先代理
ruleset=🚀 手动选择,clash-domain:https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt,86400

; 明确代理域名大库
; 必须放在 direct.txt 前，以 Loyalsoldier 官方白名单顺序处理冲突
ruleset=🚀 手动选择,clash-domain:https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt,86400

; 明确直连域名大库
ruleset=DIRECT,clash-domain:https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt,86400

; ============================================================
; D. 已知 IP / 未知域名的真实 IP 判定
; ============================================================

; 局域网 / 保留地址
; 不加 no-resolve：对于前面所有域名库都没认出的域名，
; 这是进入 IP 判定阶段后的首次真实 DNS 解析。
ruleset=DIRECT,clash-ipcidr:https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt,86400

; Telegram 已知 IP
; 前一条已经完成未知域名解析，这里只复用已得到的目标 IP。
ruleset=🚀 手动选择,clash-ipcidr:https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt,86400|no-resolve

; 中国大陆 IP
; 作为未知流量的最终“中国 / 非中国”位置裁判。
ruleset=DIRECT,clash-ipcidr:https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt,86400|no-resolve

; ============================================================
; E. 真正未知：默认代理
; ============================================================

ruleset=🚀 手动选择,[]FINAL

; ============================================================
; F. 唯一代理策略组
; ============================================================

custom_proxy_group=🚀 手动选择`select`.*

; 过滤订阅中的展示性伪节点
exclude_remarks=(?i)(到期|流量|套餐|官网|Expire|Traffic|Remaining|Official|Website)

; ============================================================
; G. Subconverter
; ============================================================

enable_rule_generator=true
overwrite_original_rules=true
